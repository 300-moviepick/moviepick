plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.moviepick'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring AI 버전 관리
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')
	// 신규 OpenAI GPT
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// 웹·JPA·검증
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 인증·인가 (JWT + 카카오·구글 OAuth2 로그인)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

	// JWT (jjwt는 BOM 관리 대상이 아니라 버전을 직접 지정, 최신 안정 버전 확인 필요)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Spring Batch + JDBC 실행 이력 관리
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'

	// Redis: Refresh Token 저장, 캐시
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Spring Cache
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// DB·유틸
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// QueryDSL (Jakarta JPA)
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.1:jpa'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// 패키지 의존 규칙 검사 (BOM 관리 대상이 아니라 버전을 직접 지정)
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

	// H2 2.4.240의 CHECK 제약조건 버그를 피하려고 버전을 직접 지정
	testRuntimeOnly 'com.h2database:h2:2.5.252'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

// 테스트 커버리지 보고서 (커버리지 기준 강제는 하지 않음)
jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}